services:
  web:
    build:
      context: ./apps/web
      args:
        VITE_CALENDAR_FEED_URL: /calendar-feed.php
    container_name: conheca_sumare_calendar_react_hml
    restart: unless-stopped
    volumes:
      - ./apps/web/nginx.calendar-hml.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-traefik_app_network"
      - 'traefik.http.routers.sumare-calendar-react-hml.rule=Host(`p000096.hml.vitrineiapro.com.br`)'
      - "traefik.http.routers.sumare-calendar-react-hml.entrypoints=websecure"
      - "traefik.http.routers.sumare-calendar-react-hml.tls=true"
      - "traefik.http.routers.sumare-calendar-react-hml.tls.certresolver=le"
      - "traefik.http.services.sumare-calendar-react-hml.loadbalancer.server.port=80"
    networks:
      - traefik
      - existing_hml
networks:
  traefik:
    external: true
    name: n8n-traefik_app_network
  existing_hml:
    external: true
    name: conheca-sumare-hml_default
