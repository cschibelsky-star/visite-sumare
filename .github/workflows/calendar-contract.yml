name: Calendar Contract
on:
  pull_request:
    paths: ['apps/web/**', 'apps/api/**', 'apps/shared/**', 'tests/**', '.github/workflows/calendar-contract.yml', 'docker-compose.calendar-hml.yml']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: node --test apps/shared/events.test.mjs tests/agenda-api.test.mjs tests/calendar-contract.test.mjs
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
        env:
          VITE_CALENDAR_FEED_URL: /calendar-feed.php
