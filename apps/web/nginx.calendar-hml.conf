server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /calendar-feed.php {
    proxy_pass http://conheca_sumare_calendar_hml:80/calendar-feed.php;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }
  location /api/ {
    proxy_pass http://conheca_sumare_api_hml:8787/api/;
    proxy_set_header Host $host;
  }
  location /uploads/ {
    proxy_pass http://conheca_sumare_api_hml:8787/uploads/;
  }
  location / { try_files $uri $uri/ /index.html; }
}
