name: conheca-home-review
services:
  api:
    build: ./apps/api
    command: ["node", "src/review.js"]
    restart: "no"
    environment:
      DATA_DIR: /app/review-data
      UPLOADS_DIR: /app/review-uploads
    tmpfs:
      - /app/review-data
      - /app/review-uploads
    networks:
      review:
        aliases: [conheca-review-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.review
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    networks: [review]
    ports:
      - "127.0.0.1:18995:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  review:
    external: true
    name: n8n-traefik_app_network

